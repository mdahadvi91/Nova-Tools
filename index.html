    <!-- Google Consent Mode v2 Default Setup -->
    <script>
      window.dataLayer = window.dataLayer || [];

      function gtag() {
        dataLayer.push(arguments);
      }

      var storedConsent = null;

      try {
        var raw = localStorage.getItem('nova_consent_settings');

        if (raw) {
          storedConsent = JSON.parse(raw);
        }
      } catch (e) {}

      var analyticsGranted =
        storedConsent && storedConsent.analytics === true
          ? 'granted'
          : 'denied';

      var advertisingGranted =
        storedConsent && storedConsent.advertising === true
          ? 'granted'
          : 'denied';

      gtag('consent', 'default', {
        analytics_storage: analyticsGranted,
        ad_storage: advertisingGranted,
        ad_user_data: advertisingGranted,
        ad_personalization: advertisingGranted,
        wait_for_update: 500
      });

      gtag('js', new Date());

      /*
       * Nova Tools is a React SPA.
       * Pageviews are tracked explicitly by analytics.ts.
       */
      gtag('config', 'G-NPEXBRERPT', {
        send_page_view: false
      });
    </script>

    <!-- Google Tag Manager -->
    <script>
      (function(w,d,s,l,i){

          event:'gtm.js'
        });

        var f=d.getElementsByTagName(s)[0],
            j=d.createElement(s),
            dl=l!='dataLayer'?'&l='+l:'';

        j.async=true;
        j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;

        f.parentNode.insertBefore(j,f);
      })(window,document,'script','dataLayer','GTM-PL3MF7NW');
    </script>
