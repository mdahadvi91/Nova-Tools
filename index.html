    <!-- WebSite Structured Data -->
    <script type="application/ld+json" id="nova-schema-website">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Nova Tools",
        "url": "https://nova-tools-hr.vercel.app/",
        "description": "Free, privacy-first online tools for image conversion, PDF processing, QR codes, career tools, calculators, text tools, and developer utilities.",
        "publisher": {
          "@type": "Organization",
          "name": "Nova Tools",
          "url": "https://nova-tools-hr.vercel.app/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://nova-tools-hr.vercel.app/assets/background.jpg"
          }
        }
      }
    </script>

    <!-- Performance: Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Google Consent Mode v2 -->
    <script>
      window.dataLayer = window.dataLayer || [];

      function gtag() {
        dataLayer.push(arguments);
      }

      var storedConsent = null;

      try {
        var raw = localStorage.getItem("nova_consent_settings");

        if (raw) {
          storedConsent = JSON.parse(raw);
        }
      } catch (e) {}

      var analyticsGranted =
        storedConsent && storedConsent.analytics === true
          ? "granted"
          : "denied";

      var advertisingGranted =
        storedConsent && storedConsent.advertising === true
          ? "granted"
          : "denied";

      gtag("consent", "default", {
        analytics_storage: analyticsGranted,
        ad_storage: advertisingGranted,
        ad_user_data: advertisingGranted,
        ad_personalization: advertisingGranted,
        wait_for_update: 500
      });

      gtag("js", new Date());

      // SPA virtual pageviews are tracked by the application.
      gtag("config", "G-N4MHBT57FE", {
        send_page_view: false
      });
    </script>

    <!-- Google Analytics -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-N4MHBT57FE"
    ></script>

    <!-- Google AdSense
         Keep current publisher code for the existing setup.
         Replace only when Google provides the new code for the new application. -->
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5216241068377334"
      crossorigin="anonymous"
    ></script>
